services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mysql_to_sqlite_test
      MYSQL_ROOT_PASSWORD: test-password
    ports:
      - "${MYSQL_TEST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptest-password"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql
